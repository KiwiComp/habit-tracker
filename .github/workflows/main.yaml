name: habit_tracker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # One job per tested package (rather than a single root job) so each
  # package's own test suite actually runs in CI — the previous single job
  # only ran the root app's tests, so habits_repository's suite never gated
  # anything. Each target below is the level the *finished* package should
  # hold, not today's number: these gates are meant to stay red until the
  # code earns green, not be lowered to whatever coverage currently is.
  # `coverage_excludes` drops generated code (Drift `*.g.dart`, l10n `gen/`)
  # from the denominator so the percentage reflects hand-written code only.
  #
  # error_tracking has no real test suite yet, so it gets no job here — see
  # TODO.md. Add it once it's tested.
  build-app:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: "."
      min_coverage: 80
      # Exclude the workspace packages (gated by their own jobs), generated
      # localizations, and any generated Dart, so this measures the app's
      # own lib only.
      coverage_excludes: "packages/** lib/l10n/gen/** **/*.g.dart"
      run_bloc_lint: true

  build-habits-repository:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/habits_repository
      min_coverage: 90
      coverage_excludes: "**/*.g.dart"
      # No blocs in this package, so nothing for bloc_lint to check (and it
      # has no bloc_tools dependency to run it with).
      run_bloc_lint: false

  build-app-ui:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      working_directory: packages/app_ui
      # Pure design-system package with no generated code — fully covered, so
      # its finished-package target is 100%.
      min_coverage: 100
      run_bloc_lint: false

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
      modified_files_only: false
